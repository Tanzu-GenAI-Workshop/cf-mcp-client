<div class="app-container" [class.panel-open]="panelOpen()" role="application" aria-label="Tanzu Platform Chat Application">
  <header role="banner">
    <mat-toolbar>
      <mat-icon class="app-mark" svgIcon="fp-chat" aria-hidden="true"></mat-icon>
      <h1 class="app-title">Tanzu Platform Chat</h1>
      <button type="button"
              class="theme-toggle"
              (click)="toggleTheme()"
              [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
              [attr.aria-pressed]="theme() === 'dark'"
              matTooltip="{{ theme() === 'dark' ? 'Light mode' : 'Dark mode' }}">
        <mat-icon [svgIcon]="theme() === 'dark' ? 'fp-sun' : 'fp-moon'" aria-hidden="true"></mat-icon>
      </button>
      <span style="flex:1 1 auto"></span>
      <div class="topbar-status">
        <span class="fp-pill fp-pill--mono" [class.status-changed]="statusChanged('model')">
          <mat-icon svgIcon="fp-model" aria-hidden="true"></mat-icon>
          {{ metrics().chatModel || 'no model bound' }}
        </span>
        <span class="fp-pill"
              [class.status-changed]="statusChanged('model')"
              [class.fp-pill--ready]="metrics().chatModel !== ''"
              [class.fp-pill--offline]="metrics().chatModel === ''"
              role="status">
          <mat-icon [svgIcon]="metrics().chatModel !== '' ? 'fp-ready' : 'fp-offline'" aria-hidden="true"></mat-icon>
          {{ metrics().chatModel !== '' ? 'Connected' : 'Offline' }}
        </span>
      </div>
    </mat-toolbar>
  </header>

  <!-- Navigation Rail for medium screens and up -->
  <app-navigation-rail
    class="md-hide-compact"
    [metrics]="metrics()">
  </app-navigation-rail>

  <!-- Bottom Navigation for mobile -->
  <app-bottom-navigation
    class="md-show-compact"
    [metrics]="metrics()">
  </app-bottom-navigation>

  <!-- Side panels as complementary content -->
  <aside role="complementary" aria-label="Application panels">
    <app-chat-panel
      [metrics]="metrics()">
    </app-chat-panel>
    <app-document-panel
      [metrics]="metrics()"
      (documentIdsChanged)="onDocumentIdsChanged($event)">
    </app-document-panel>
    <app-mcp-servers-panel
      [metrics]="metrics()">
    </app-mcp-servers-panel>
    <app-agents-panel
      [metrics]="metrics()"
      (messageSent)="onAgentMessageSent($event.agent, $event.message)">
    </app-agents-panel>
    <app-memory-panel
      [metrics]="metrics()">
    </app-memory-panel>
  </aside>

  <main role="main" aria-label="Chat conversation">
    <app-chatbox
      [metrics]="metrics()"
      [documentIds]="currentDocumentIds()">
    </app-chatbox>
  </main>
</div>
