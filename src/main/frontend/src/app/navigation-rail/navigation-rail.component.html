<nav class="navigation-rail" role="navigation" aria-label="Main navigation">
  <div class="nav-rail-container">
    @for (item of navigationItems; track item.id) {
      <div class="nav-rail-item">
        <button
          type="button"
          class="nav-rail-button"
          [class.active]="(activePanel() ?? 'chat') === item.id"
          [attr.aria-current]="(activePanel() ?? 'chat') === item.id ? 'page' : null"
          (click)="onNavItemClick(item.id)"
          [matTooltip]="getTooltipText(item)"
          matTooltipPosition="left"
          [attr.aria-label]="item.tooltip"
          [attr.data-nav-item]="item.id">

          <div class="nav-rail-button-content">
            <!-- Neutral glyph; state rides as a small shape-coded badge -->
            <mat-icon class="nav-rail-icon" [attr.aria-hidden]="true" [svgIcon]="item.icon"></mat-icon>
            @if (getStatusIndicator(item.id).show) {
              <mat-icon
                class="nav-rail-state"
                [class.status-changed]="statusChanged(item.id)"
                [ngClass]="getStatusIndicator(item.id).color"
                [svgIcon]="getStatusIndicator(item.id).icon"
                [attr.aria-hidden]="true"></mat-icon>
            }
          </div>

          <!-- Label -->
          <span class="nav-rail-label">{{ item.label }}</span>
        </button>
      </div>
    }
  </div>

  <div class="nav-rail-footer">
    <div class="nav-rail-item">
      <button
        type="button"
        class="nav-rail-button"
        (click)="onLogout()"
        matTooltip="Sign out"
        matTooltipPosition="left"
        aria-label="Sign out">
        <div class="nav-rail-button-content">
          <mat-icon class="nav-rail-icon" aria-hidden="true" svgIcon="fp-logout"></mat-icon>
        </div>
        <span class="nav-rail-label">Sign out</span>
      </button>
    </div>
  </div>
</nav>
